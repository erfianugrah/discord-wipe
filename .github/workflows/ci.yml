name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.7.4

      - name: ruff check
        run: ruff check discord_wipe.py

      - name: ruff format --check
        run: ruff format --check discord_wipe.py

      - name: py_compile (syntax sanity)
        run: python -m py_compile discord_wipe.py

  docker-build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4

      # Build only — no push. Catches Dockerfile regressions on PRs
      # without touching ghcr.io.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: discord-wipe:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test image (no token; expects argparse exit)
        run: |
          docker run --rm discord-wipe:ci --help | head -20
          docker run --rm discord-wipe:ci verify --help | head -10
