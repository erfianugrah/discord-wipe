# discord-wipe stack.
#
# Deploy on servarr at /mnt/user/appdata/discord-wipe/.
# Bring-up: `docker compose up -d --build && docker compose logs -f`.
#
# Token lives in ./.env (DISCORD_TOKEN=...). Never commit that file.
# Export sits at ./export/Messages/. State persists at ./state/.

services:
  discord-wipe:
    # Pulled by composer / docker compose pull. Override DISCORD_WIPE_TAG
    # in .env to pin to a release tag (e.g. v1.2.3); default :main
    # tracks the latest release.yml build off the main branch.
    image: ghcr.io/erfianugrah/discord-wipe:${DISCORD_WIPE_TAG:-main}
    # Build context is kept for local dev (./discord_wipe.py changes
    # without a CI roundtrip). Compose only builds if the image isn't
    # available locally and `docker compose up --build` is used.
    build:
      context: .
    container_name: discord-wipe
    restart: unless-stopped
    # Give state.save() room on slow disks before docker SIGKILLs us.
    # State is small (~2MB at 100K IDs) so 30s is generous even on a
    # degraded array.
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      RETENTION_DAYS: "14"
      DELETE_DELAY: "1.0"
      # Halved from v0.3.x default (was 30s) — Discord's search index
      # refreshes in ~5-10s in practice.
      SEARCH_DELAY: "15.0"
      INTERVAL_HOURS: "24"
      WATCH: "1"
      METRICS_ENABLED: "1"
      METRICS_BIND: "0.0.0.0:9090"
      # Optional: set NTFY_URL=https://ntfy.sh/<your-topic> in .env
      # to receive push notifications when the daemon parks itself.
      TZ: "Europe/Amsterdam"
    # Localhost-only metrics endpoint. Prometheus on the same host can
    # scrape http://127.0.0.1:9090/metrics; external access is blocked.
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      # ABSOLUTE host paths — composer-managed stacks run via a daemon
      # inside a container, so relative `./` paths resolve to the
      # composer container's view (not the host) and silently miss.
      # Override with DISCORD_WIPE_DATA_DIR to relocate. Default follows
      # the user's per-stack convention (`/mnt/user/<stack>/`).
      - ${DISCORD_WIPE_DATA_DIR:-/mnt/user/discord-wipe}/export:/data/export:ro
      - ${DISCORD_WIPE_DATA_DIR:-/mnt/user/discord-wipe}/state:/data/state
    # No inbound network. Default bridge with outbound-only is plenty.
    # Resource caps so a runaway loop can't eat the host.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
